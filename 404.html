<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Luis JL</title>
  <meta name="theme-color" content="#ffe14d">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #ffe14d; color: #111; font: 500 1.0625rem/1.6 'Archivo', system-ui, sans-serif; }
    .box { width: min(100%, 520px); background: #fffdf5; border: 3px solid #111; box-shadow: 12px 12px 0 #111; padding: clamp(24px, 6vw, 48px); text-align: center; }
    h1 { font: 400 clamp(5rem, 22vw, 8rem)/0.85 'Archivo Black', 'Arial Black', sans-serif; margin: 0 0 12px; display: inline-block; background: #ff5d8f; border: 3px solid #111; padding: 0 0.12em 0.06em; transform: rotate(-3deg); }
    p { margin: 16px 0 28px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 14px 22px; font-weight: 700; text-decoration: none; color: #fffdf5; background: #111; border: 3px solid #111; box-shadow: 4px 4px 0 #ff5d8f; transition: transform 120ms ease, box-shadow 120ms ease; }
    a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #ff5d8f; }
    a:active { transform: translate(4px, 4px); box-shadow: none; }
    a:focus-visible { outline: 3px solid #111; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    @media (prefers-color-scheme: dark) {
      body { background: #141414; color: #fffdf5; }
      .box { background: #1f1f1f; border-color: #fffdf5; box-shadow: 12px 12px 0 #ffe14d; }
      h1 { color: #111; }
      a { color: #111; background: #ffe14d; border-color: #fffdf5; }
      a:focus-visible { outline-color: #fffdf5; }
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <p>Esta página no existe o se ha movido.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
