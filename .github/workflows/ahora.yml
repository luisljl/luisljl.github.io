# Pone al día assets/now.json (sección «Ahora mismo») con el juego destacado de jlgamesdev.com.
# Una vez al día y a mano desde la pestaña Actions. Solo hace commit si algo cambió.
name: Ahora mismo

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ahora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/ahora.mjs
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- assets/now.json; then
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/now.json
            git commit -m "Ahora mismo: datos de jlgamesdev.com"
            git push
          fi
